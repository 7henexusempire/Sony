name: Fetch M3U Playlist

on:
  schedule:
    # Runs every 7 minutes
    - cron: '*/7 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download M3U Playlist
        run: |
          # Fetch playlist with a custom User-Agent to prevent bot-blocking
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://thenexusempire.com/nexusempire/sony.m3u" \
            -o sony.m3u

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add sony.m3u

          # Only commit if the content actually changed
          if git diff --staged --quiet; then
            echo "No changes found in sony.m3u."
          else
            git commit -m "Auto-update sony.m3u [skip ci]"
            git push
          fi
