name: Update Playlists

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs roughly every 7 minutes
    - cron: '*/7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, curl

      - name: Run Fetcher Script
        run: php update.php

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist.json sonyevents.m3u sonyevents.json

          if git diff --staged --quiet; then
            echo "No changes found. Skipping commit."
          else
            git commit -m "Auto-update playlists [skip ci]"
            git push
          fi
